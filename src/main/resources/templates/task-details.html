<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Task</title>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">

    <h2 th:text="${task.title}"></h2>

    <p th:text="${task.description}"></p>

    <p>Status: <b th:text="${task.status}"></b></p>
    <p>Priority: <b th:text="${task.priority}"></b></p>
    <p th:if="${task.dueDate != null}">
        Due: <b th:text="${task.dueDate}"></b>
    </p>

    <hr>

    <a th:href="@{/projects/{pid}/tasks/{tid}/edit(
        pid=${task.project.id},
        tid=${task.id}
    )}">
        Edit
    </a>

    |
    <a th:href="@{/projects/{pid}(pid=${task.project.id})}">
        Back to project
    </a>

</div>
</body>
</html>
